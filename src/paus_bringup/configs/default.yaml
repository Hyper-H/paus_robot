aruco:
  dictionary: DICT_4X4_50
  target_id: 7
  adaptive_thresh_constant: 7
  adaptive_thresh_block_size: 31
  min_candidate_area: 1200
  approx_epsilon_ratio: 0.04

output:
  export_debug: true
  debug_square_size: 160
  contour_line_thickness: 2

pose:
  marker_length_m: 0.06
  approach_distance_m: 0.05
  target_frame: camera
  min_forward_distance_m: 0.02
  max_pose_distance_m: 1.5
  max_pose_jump_m: 0.25

transform:
  marker_to_target:
    translation_m: [0.0, 0.0, 0.0]
    rotation_rpy_deg: [0.0, 0.0, 0.0]
  max_target_distance_mm: 1500.0

calibration:
  board_rows: 8
  board_cols: 11
  square_size_m: 0.02
  solver_method: "joint_absolute"
  min_sample_count: 10
  output_path: "/mnt/data/projects/paus_robot/calibration/current/extrinsics.yaml"
  example_output_path: "src/paus_bringup/configs/extrinsics.yaml"
  trajectory_path: "src/paus_bringup/configs/eye_to_hand_trajectory.example.yaml"
  session_root_path: "/mnt/data/projects/paus_robot/calibration/sessions"
  save_sample_images: true
  max_reprojection_error_px: 2.5
  min_board_margin_px: 10.0
  stable_position_tolerance_mm: 0.2
  stable_rotation_tolerance_deg: 0.1
  stable_window_s: 0.5
  stable_timeout_s: 10.0
  dwell_s: 0.5
  corner_patch_size_px: 5
  corner_min_points: 8
  min_valid_corner_patch_ratio: 0.80
  max_local_plane_residual_median_mm: 1.0
  max_local_plane_residual_p95_mm: 2.0
  min_global_plane_selected_ratio: 0.70
  max_board_model_fit_rmse_mm: 2.0
  max_board_model_fit_max_mm: 5.0
  min_board_center_z_m: 0.20
  max_board_center_z_m: 0.80
  tool_to_board:
    translation_m: [0.0, 0.0, 0.0]
    rotation_rpy_deg: [0.0, 0.0, 0.0]

neck_surface:
  enabled: true
  eval_enabled: true
  image_topic: "/camera/image_bridge"
  depth_topic: "/camera/depth_aligned"
  camera_info_topic: "/camera/camera_info"
  pose_topic: "/neck_surface_pose"
  target_pose_topic: "/target_pose_base"
  approach_target_topic: "/approach_target"
  status_topic: "/neck_surface_status"
  debug_image_topic: "/neck_roi_debug_image"
  publish_debug_image: true
  keypoint_confidence_threshold: 0.5
  alpha_with_ears: 0.72
  alpha_with_nose: 0.78
  roi_width_shoulder_scale: 0.35
  roi_height_head_shoulder_scale: 0.45
  center_window_scale: 0.34
  depth_outlier_mm: 50.0
  patch_radius_mm: 30.0
  min_center_points: 80
  min_patch_points: 50
  max_plane_rmse_mm: 8.0
  target_mode: "refined_surface"
  target_region: "patient_left"
  lateral_offset_mm: 50.0
  inferior_offset_mm: 10.0
  hover_distance_mm: 80.0
  latched_pose_timeout_s: 0.5
  max_rgb_depth_delta_ms: 200.0
  logging_enabled: true
  logging_output_dir: "/mnt/data/projects/paus_robot/runs/markerless-neck-surface-design"
  log_every_n_frames: 1
  log_only_ok_frames: false
  max_logged_frames: 200
  save_depth: false
  save_debug_eval: true
  save_debug_surface: true

targeting:
  mode: "markerless_neck"
  source_timeout_ms: 2000

target_lock:
  enabled: true
  policy: "lock_once_episode"
  stale_after_locked_action: "warn_only"
  allow_relock_during_motion: false
  collect_duration_s: 4.0
  min_samples: 3
  max_sample_age_ms: 2500
  max_sample_jump_mm: 120.0
  max_position_spread_mm: 60.0
  locked_publish_rate_hz: 5.0
  drift_warning_mm: 80.0
  drift_action: "warn_only"

control:
  robot_ip: "192.168.58.2"
  linux_fairino_sdk_root: "/opt/fairino_python_sdk/linux"
  execute_motion: false
  tool_id: 2
  user_id: 0
  move_vel: 10.0
  move_acc: 10.0
  move_ovl: 20.0
  joint_motion_blend_time_ms: 0.0
  joint_motion_done_timeout_s: 120.0
  motion_strategy: "staged_patient_left_final_hover"
  move_to_approach_ready_on_start: false
  approach_ready_joint_deg: [-62.70517349243164, -66.33631896972656, -66.36199188232422, -91.33271789550781, 115.38646697998047, -73.511]
  approach_ready_tolerance_deg: 10.0
  approach_ready_vel: 30.0
  pre_approach_vel: 20.0
  final_hover_vel: 5.0
  final_hover_servo_enabled: false
  final_hover_servo_cmd_t_s: 0.02
  final_hover_servo_max_step_mm: 1.0
  final_hover_servo_max_step_deg: 0.3
  final_hover_servo_ready_timeout_s: 10.0
  final_hover_servo_orientation_enabled: true
  max_direct_final_hover_distance_mm: 250.0
  blendR: -1.0
  orientation_mode: "face_marker_normal"
  flange_face_axis: "-Z"
  roll_policy: "base_up_projection"
  roll_offset_deg: 0.0
  hover_clearance_mm: 50.0
  pre_approach_distance_mm: 80.0
  prefer_positive_z_surface_normal: false
  enable_safe_lift_on_low_clearance: true
  safe_lift_step_mm: 80.0
  safe_lift_above_marker_mm: 180.0
  safe_lift_max_z_mm: 500.0
  max_step_distance_mm: 10.0
  max_execution_stage: "final_hover"
  target_hold_timeout_ms: 5000
  completion_position_tolerance_mm: 20.0
  completion_normal_tolerance_deg: 10.0
  min_safe_z_mm: 50.0
  min_plane_clearance_mm: 10.0
  workspace_min_mm: [-2000.0, -2000.0, 0.0]
  workspace_max_mm: [2000.0, 2000.0, 2000.0]
  repeat_distance_threshold_mm: 5.0
  stage_switch_buffer_mm: 10.0
  max_marker_displacement_before_relatch_mm: 200.0
  require_locked_target_before_motion: true
  continue_with_last_locked_target_on_source_loss: true
  debug_reset_after_success: false
  min_consecutive_detections: 2
  use_mock_pose: false
  mock_current_tcp_pose_mmdeg: [0.0, 0.0, 300.0, 180.0, 0.0, -180.0]
